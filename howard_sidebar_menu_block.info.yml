name: 'Howard Sidebar Menu Block'
type: module
description: 'Provides a sophisticated context-aware sidebar navigation menu for Howard University sites that automatically displays relevant menu items based on the current page position in the site hierarchy.'
core_version_requirement: ^10 || ^11
version: '11.0.5'
package: 'Howard University'

dependencies:
  - drupal:block
  - drupal:menu_link_content

configure: admin/structure/block

# Custom module - not distributed via drupal.org
# Available via Packagist: howard/howard_sidebar_menu_block
